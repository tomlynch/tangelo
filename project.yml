name: Tangelo
options:
  bundleIdPrefix: com.tomlynch
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    DEAD_CODE_STRIPPING: YES
targets:
  Tangelo:
    type: application
    platform: macOS
    sources:
      - path: Tangelo
      - path: Vendor/VLCKit-COPYING.txt
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - framework: Vendor/VLCKit.xcframework
        embed: true
        codeSign: true
    preBuildScripts:
      - name: Check VLCKit
        script: |
          if [ ! -d "${SRCROOT}/Vendor/VLCKit.xcframework" ]; then
            echo "error: VLCKit missing. Run scripts/fetch-vlckit.sh first."
            exit 1
          fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomlynch.tangelo
        PRODUCT_NAME: Tangelo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: Tangelo/Resources/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
